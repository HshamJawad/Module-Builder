<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module Builder v3.1 — User Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&display=swap');

  :root {
    --ink:    #1a1a2e;
    --muted:  #5f6b7a;
    --accent: #667eea;
    --accent2:#764ba2;
    --green:  #10b981;
    --amber:  #f59e0b;
    --red:    #ef4444;
    --border: #e5e7eb;
    --bg:     #f8f9ff;
    --card:   #ffffff;
    --grad:   linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    background: var(--bg);
  }

  /* ── HEADER ── */
  .hero {
    background: var(--grad);
    color: white;
    padding: 60px 24px 50px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    padding: 5px 16px;
    font-size: 0.78em;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2em, 6vw, 3.6em);
    line-height: 1.15;
    margin-bottom: 14px;
  }
  .hero p {
    font-size: 1.1em;
    opacity: 0.88;
    max-width: 560px;
    margin: 0 auto 28px;
  }
  .hero-meta {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 0.82em;
    opacity: 0.75;
  }
  .hero-meta span { display: flex; align-items: center; gap: 5px; }

  /* ── NAV ── */
  .toc-bar {
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 0 24px;
    box-shadow: 0 1px 12px rgba(0,0,0,0.06);
  }
  .toc-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .toc-inner::-webkit-scrollbar { display: none; }
  .toc-inner a {
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    padding: 14px 14px;
    font-size: 0.82em;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .toc-inner a:hover { color: var(--accent); border-color: var(--accent); }

  /* ── LAYOUT ── */
  .container { max-width: 860px; margin: 0 auto; padding: 0 24px 80px; }

  /* ── SECTION ── */
  .section { margin-top: 60px; }
  .section-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--grad);
    color: white;
    font-size: 0.72em;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .section h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.9em;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .section > p.lead {
    color: var(--muted);
    font-size: 1em;
    margin-bottom: 28px;
    max-width: 680px;
  }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .card-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2em;
    flex-shrink: 0;
  }
  .card h3 {
    font-size: 1.05em;
    font-weight: 700;
    color: var(--ink);
  }
  .card h3 small {
    display: block;
    font-size: 0.8em;
    font-weight: 400;
    color: var(--muted);
    margin-top: 1px;
  }

  /* ── STEP LIST ── */
  .steps { display: flex; flex-direction: column; gap: 12px; }
  .step {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--grad);
    color: white;
    font-size: 0.78em;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .step p { font-size: 0.93em; color: var(--ink); line-height: 1.6; }
  .step p strong { color: var(--accent2); }

  /* ── FEATURE GRID ── */
  .feat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    margin-top: 10px;
  }
  .feat {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .feat-ico { font-size: 1.4em; flex-shrink: 0; margin-top: 1px; }
  .feat strong { display: block; font-size: 0.9em; color: var(--ink); margin-bottom: 3px; }
  .feat span { font-size: 0.82em; color: var(--muted); line-height: 1.5; }

  /* ── BADGE PILLS ── */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.78em;
    font-weight: 700;
  }
  .pill-green  { background: #dcfce7; color: #15803d; }
  .pill-blue   { background: #dbeafe; color: #1d4ed8; }
  .pill-amber  { background: #fef3c7; color: #b45309; }
  .pill-purple { background: #ede9fe; color: #7c3aed; }
  .pill-red    { background: #fee2e2; color: #b91c1c; }

  /* ── TOOLBAR PREVIEW ── */
  .toolbar-demo {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 12px 0;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .tb-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 0.78em;
    font-weight: 700;
    white-space: nowrap;
  }
  .tb-green  { background: #10b981; color: white; }
  .tb-blue   { background: #667eea; color: white; }
  .tb-amber  { background: #f59e0b; color: white; }
  .tb-red    { background: #ef4444; color: white; }
  .tb-grey   { background: #6b7280; color: white; }
  .tb-cyan   { background: #0ea5e9; color: white; }

  /* ── MARK SAMPLES ── */
  .mark-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .mark-item {
    border-radius: 7px;
    overflow: hidden;
    border: 1.5px solid;
    display: flex;
    align-items: stretch;
  }
  .mark-hdr {
    padding: 6px 14px;
    font-size: 0.8em;
    font-weight: 700;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 120px;
  }
  .mark-body {
    padding: 6px 14px;
    font-size: 0.8em;
    color: var(--muted);
    display: flex;
    align-items: center;
  }

  /* ── TABLE ── */
  .ref-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88em;
    margin-top: 12px;
  }
  .ref-table th {
    background: #f3f4f6;
    padding: 10px 14px;
    text-align: start;
    font-weight: 700;
    color: var(--ink);
    border-bottom: 2px solid var(--border);
  }
  .ref-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    color: var(--ink);
  }
  .ref-table tr:last-child td { border-bottom: none; }
  .ref-table tr:hover td { background: #fafafa; }

  /* ── CALLOUT ── */
  .callout {
    border-radius: 10px;
    padding: 14px 18px;
    margin: 16px 0;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    font-size: 0.9em;
    line-height: 1.6;
  }
  .callout-tip    { background: #fffbeb; border: 1px solid #fde68a; }
  .callout-info   { background: #eff6ff; border: 1px solid #bfdbfe; }
  .callout-warn   { background: #fff7ed; border: 1px solid #fed7aa; }
  .callout-icon   { font-size: 1.3em; flex-shrink: 0; margin-top: 1px; }

  /* ── FOOTER ── */
  .guide-footer {
    background: var(--ink);
    color: rgba(255,255,255,0.7);
    text-align: center;
    padding: 36px 24px;
    font-size: 0.85em;
  }
  .guide-footer strong { color: white; }
  .guide-footer a { color: #a5b4fc; text-decoration: none; }

  /* ── DIVIDER ── */
  hr.section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 48px 0 0;
  }

  @media (max-width: 640px) {
    .feat-grid { grid-template-columns: 1fr; }
    .hero h1 { font-size: 2em; }
  }

  /* ── ADDITIONS FOR THE TRILINGUAL EDITION ── */

  /* ── THE CLICK BUG ───────────────────────────────────────
     .hero::before is an absolutely positioned pattern overlay with no
     z-index. Absolutely positioned elements paint ABOVE their static
     siblings, so that overlay sat on top of the language buttons and
     swallowed every click — you could see its ✦ pattern drawn over the
     button labels. The original guide had nothing clickable in the
     hero, so it never showed. One stacking context on the hero's real
     children puts them back in front. */
  .hero > * { position: relative; z-index: 1; }

  /* ── Arabic typeface ─────────────────────────────────────
     Cairo, served from the repository's own /fonts folder — the same
     file and the same spellings the tool itself loads in
     mb-styles.css. Local rather than hosted, so the font comes from the
     same origin as the page and does not depend on Google Fonts being
     reachable.

     PATHS ARE RELATIVE TO THIS FILE. The guide sits at the repository
     ROOT beside index.html, so `fonts/...` is correct and is listed
     first; mb-styles.css uses the same bare prefix for the same reason.
     The `../fonts/...` spellings follow as a second chance in case the
     guide is ever moved down into src/ — a wrong URL in this list costs
     nothing, because the browser simply walks to the next one.

     The several capitalisations are also deliberate: GitHub Pages is
     case-sensitive and the file may have shipped as Cairo.woff2,
     cairo.woff2 or with a -VF suffix. If every URL 404s the stack falls
     through to Segoe UI / Tahoma and the guide still reads correctly —
     it simply looks plainer. */
  @font-face {
    font-family: 'Cairo';
    src: url('fonts/Cairo.woff2')            format('woff2'),
         url('fonts/cairo.woff2')            format('woff2'),
         url('fonts/Cairo-VF.woff2')         format('woff2'),
         url('fonts/Cairo-Regular.woff2')    format('woff2'),
         url('../fonts/Cairo.woff2')         format('woff2'),
         url('../fonts/cairo.woff2')         format('woff2');
    font-weight: 200 1000;
    font-style: normal;
    font-display: swap;
  }

  /* DM Sans has no Arabic glyphs at all. The Latin faces stay first so
     English and French are untouched, and Cairo covers the Arabic. */
  body.is-rtl {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    font-size: 15.5px;
    line-height: 1.9;
  }
  body.is-rtl .hero h1,
  body.is-rtl h2,
  body.is-rtl h3 {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    font-weight: 700;
  }
  /* Latin fragments inside Arabic prose — 'Word', '.docx', hex codes —
     would otherwise fall to whatever the browser substitutes, which is
     how one paragraph ends up in three typefaces. */
  body.is-rtl code { direction: ltr; unicode-bidi: embed; font-family: 'Cairo', monospace; }

  /* Language switcher */
  .lang-switch {
    display: inline-flex;
    gap: 4px;
    margin-top: 22px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    padding: 4px;
  }
  .lang-btn {
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.85);
    font-family: inherit;
    font-size: 0.82em;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .lang-btn:hover { background: rgba(255,255,255,0.16); color: white; }
  .lang-btn.is-on { background: white; color: var(--accent2); }

  /* Toolbar demo additions */
  kbd { display:inline-block; padding:1px 6px; border:1px solid #d7dade; border-bottom-width:2px; border-radius:5px; background:#f6f7f9; font:600 .85em/1.4 ui-monospace,Consolas,monospace; color:#3f464d; direction:ltr; unicode-bidi:isolate; }
  .tb-silver { background: #f1f2f4; color: #3f464d; border: 1px solid #d7dade; }
  .tb-green-solid { background: #4A7C6A; color: white; }
  .tb-plain { font-size: 0.85em; font-weight: 600; color: var(--muted); }

  .soft { font-size: 0.9em; color: var(--muted); margin-bottom: 12px; }
  .card .soft:last-child { margin-bottom: 0; }

  /* Colour palette display */
  .palette {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    margin: 14px 0 4px;
  }
  .pal {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fafbff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.8em;
  }
  .pal-chip {
    width: 20px; height: 20px;
    border-radius: 5px;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.14) inset;
  }
  .pal-name { flex: 1; color: var(--ink); font-weight: 600; }
  .pal code { font-size: 0.9em; color: var(--muted); }

  /* Inline swatch used inside table cells */
  .swatch {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 3px;
    vertical-align: -1px;
    margin-inline-end: 5px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.16) inset;
  }

  .guide-footer .disclaimer {
    margin-top: 10px;
    font-size: 0.78em;
    opacity: 0.55;
    font-style: italic;
  }

  /* Back-to-top */
  .totop {
    position: fixed;
    bottom: 22px;
    inset-inline-end: 22px;
    background: var(--grad);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    font-family: inherit;
    font-size: 0.8em;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(102,126,234,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 60;
  }
  .totop.show { opacity: 1; pointer-events: auto; }

  @media print {
    .toc-bar, .lang-switch, .totop { display: none !important; }
    .section { break-inside: avoid; }
  }
</style>
</head>

<div class="hero" id="hero"></div>

<nav class="toc-bar">
  <div class="toc-inner" id="toc"></div>
</nav>

<div class="container" id="content"></div>

<footer class="guide-footer" id="foot"></footer>

<button type="button" class="totop" id="totop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Top</button>

/* ── Renderer ────────────────────────────────────────────────
   The guide is one file in three languages. Rather than three copies
   of the markup that drift apart the first time something changes, the
   content lives in GUIDE.en / GUIDE.fr / GUIDE.ar as data and the page
   is built from it. Adding a section means adding it once per language
   and nothing else. */

var LANGS = ['en', 'fr', 'ar'];
var UI = {
  en: { pick: 'Language', top: '↑ Top' },
  fr: { pick: 'Langue',   top: '↑ Haut' },
  ar: { pick: 'اللغة',    top: '↑ الأعلى' }
};

function esc(s) { return String(s); }

/* ── Block renderers, one per block type ─────────────────── */
var BLOCK = {
  p: function (b) {
    return '<p class="soft">' + b.txt + '</p>';
  },
  feats: function (b) {
    return '<div class="feat-grid">' + b.items.map(function (f) {
      return '<div class="feat"><div class="feat-ico">' + f.ico + '</div>' +
             '<div><strong>' + f.h + '</strong><span>' + f.p + '</span></div></div>';
    }).join('') + '</div>';
  },
  steps: function (b) {
    return '<div class="steps">' + b.items.map(function (s, i) {
      return '<div class="step"><div class="step-num">' + (i + 1) + '</div><p>' + s + '</p></div>';
    }).join('') + '</div>';
  },
  table: function (b) {
    return '<table class="ref-table"><thead><tr>' +
      b.head.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      b.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  },
  callout: function (b) {
    var ico = { tip: '💡', info: 'ℹ️', warn: '⚠️' }[b.k] || 'ℹ️';
    return '<div class="callout callout-' + b.k + '"><div class="callout-icon">' + ico +
           '</div><div>' + b.txt + '</div></div>';
  },
  demo: function (b) {
    return '<div class="toolbar-demo"' + (b.center ? ' style="justify-content:center;"' : '') + '>' +
      b.items.map(function (i) {
        if (i.c === 'plain') return '<span class="tb-plain">' + i.l + '</span>';
        return '<span class="tb-btn ' + i.c + '">' + i.l + '</span>';
      }).join('') + '</div>';
  },
  palette: function (b) {
    return '<div class="palette">' + b.items.map(function (p) {
      return '<div class="pal"><span class="pal-chip" style="background:#' + p.hex + '"></span>' +
             '<span class="pal-name">' + p.n + '</span><code>' + p.hex + '</code></div>';
    }).join('') + '</div>';
  },
  marks: function (b) {
    return '<div class="mark-list">' + b.items.map(function (m) {
      return '<div class="mark-item" style="border-color:' + m.c + ';">' +
             '<div class="mark-hdr" style="background:' + m.c + ';color:' + m.tc + ';">' + m.n + '</div>' +
             '<div class="mark-body">' + m.d + '</div></div>';
    }).join('') + '</div>';
  },
  card: function (b) {
    return '<div class="card"><div class="card-header">' +
      '<div class="card-icon" style="background:' + b.bg + ';">' + b.ico + '</div>' +
      '<h3>' + b.h + (b.sub ? '<small>' + b.sub + '</small>' : '') + '</h3></div>' +
      b.blocks.map(renderBlock).join('') + '</div>';
  }
};

function renderBlock(b) {
  var fn = BLOCK[b.t];
  return fn ? fn(b) : '';
}

function renderSection(s) {
  return '<div class="section" id="' + s.id + '">' +
    '<div class="section-label">' + s.label + '</div>' +
    '<h2>' + s.title + '</h2>' +
    (s.lead ? '<p class="lead">' + s.lead + '</p>' : '') +
    s.blocks.map(renderBlock).join('') +
    '</div>';
}

/* ── Language ────────────────────────────────────────────── */
var STORE_KEY = 'mb_guide_lang';

function pickInitialLang() {
  try {
    var saved = localStorage.getItem(STORE_KEY);
    if (saved && LANGS.indexOf(saved) !== -1) return saved;
  } catch (e) { /* private mode — fall through to the browser's preference */ }
  var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return LANGS.indexOf(nav) !== -1 ? nav : 'en';
}

/* The version shown in the guide comes from version.json, the single
   source the tool itself uses, so the guide can never lag behind it.
   The text written in the data is only the fallback when offline. */
var MB_VER = null;
function applyVersion() {
  if (!MB_VER) return;
  var els = document.querySelectorAll('.mb-ver');
  for (var i = 0; i < els.length; i++) els[i].textContent = MB_VER;
}
try {
  fetch('version.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.version) { MB_VER = String(j.version); applyVersion(); } })
    .catch(function () { /* keep the written fallback */ });
} catch (e) { /* keep the written fallback */ }

function render(lang) {
  var g = GUIDE[lang];
  if (!g) { lang = 'en'; g = GUIDE.en; }

  /* dir on <html> is what flips the whole layout. The stylesheet uses
     flex and logical properties throughout, so nothing else has to
     change for Arabic. */
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', g.dir);
  document.body.classList.toggle('is-rtl', g.dir === 'rtl');
  document.title = g.hero.title + ' — ' + (lang === 'ar' ? 'دليل المستخدم' : lang === 'fr' ? 'Guide de l\u2019utilisateur' : 'User Guide');

  document.getElementById('hero').innerHTML =
    '<div class="hero-badge">' + g.hero.badge + '</div>' +
    '<h1>' + g.hero.title + '</h1>' +
    '<p>' + g.hero.sub + '</p>' +
    '<div class="hero-meta">' + g.hero.meta.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</div>' +
    '<div class="lang-switch" role="group" aria-label="' + UI[lang].pick + '">' +
      LANGS.map(function (c) {
        return '<button type="button" class="lang-btn' + (c === lang ? ' is-on' : '') +
               '" data-lang="' + c + '" lang="' + c + '">' + GUIDE[c].langName + '</button>';
      }).join('') +
    '</div>';

  document.getElementById('toc').innerHTML =
    g.sections.map(function (s) { return '<a href="#' + s.id + '">' + s.nav + '</a>'; }).join('');

  document.getElementById('content').innerHTML =
    g.sections.map(function (s, i) {
      return renderSection(s) + (i < g.sections.length - 1 ? '<hr class="section-divider">' : '');
    }).join('');

  document.getElementById('foot').innerHTML =
    '<p style="margin-bottom:6px;">' + g.footer.line1 + '</p>' +
    '<p>' + g.footer.line2 + '</p>' +
    '<p style="margin-top:6px;">✉ <a href="mailto:hshaam77@gmail.com">hshaam77@gmail.com</a> &nbsp;·&nbsp; ' +
    '💼 <a href="https://www.linkedin.com/in/husham-jawad-kadhim-954006200/" target="_blank" rel="noopener">LinkedIn</a></p>' +
    '<p class="disclaimer">' + g.footer.disclaimer + '</p>';

  document.getElementById('totop').textContent = UI[lang].top;

  applyVersion();
  try { localStorage.setItem(STORE_KEY, lang); } catch (e) { /* nothing to do */ }
}

document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-lang]') : null;
  if (!b) return;
  /* Re-rendering resets the scroll anchor, so hold the reader's place:
     switching language mid-document should not send them back to the
     top of a guide this long. */
  var here = null;
  var secs = document.querySelectorAll('.section');
  for (var i = 0; i < secs.length; i++) {
    if (secs[i].getBoundingClientRect().top <= 120) here = secs[i].id;
  }
  render(b.getAttribute('data-lang'));
  if (here) {
    var el = document.getElementById(here);
    if (el) el.scrollIntoView({ block: 'start' });
  }
});

document.addEventListener('DOMContentLoaded', function () {
  render(pickInitialLang());
});

window.addEventListener('scroll', function () {
  document.getElementById('totop').classList.toggle('show', window.scrollY > 600);
});
</script>
