# ============================================================
# Bumps version.json on every push to the site.
#
# The patch number is the workflow run number, so it moves once
# per push and never needs a human to remember it. Major/minor
# stay under manual control in MAJOR_MINOR below — a run number
# is a build counter, not a statement about the release.
#
# The commit carries [skip ci] and the workflow ignores changes
# to version.json, so the push it makes cannot retrigger itself.
# ============================================================
name: Bump version

on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.json'
      - '.github/workflows/version.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write version.json
        env:
          # Was "2.1" while version.json already read 3.0.1 — the next
          # push to main would have rolled the number BACKWARDS to
          # 2.1.<run>. Raised to 3.1 with the Word export settings
          # release so the workflow and the file agree.
          #
          # Raised again with every release that moves the minor: 3.2
          # for the link/QR dialog control layout, 3.3 for the adaptive
          # toolbar, 3.4 for the PPTX export and the export centre, 3.5 for
          # the export menu.
          # version.json now reads 3.5.0, and any value left behind here
          # would roll the number backwards to <old>.<run> on the next
          # push — the same failure, one minor later.
          MAJOR_MINOR: "3.5"
        run: |
          VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
          BUILD="$(date -u +%Y-%m-%d)"
          printf '{\n  "version": "%s",\n  "build": "%s"\n}\n' "$VERSION" "$BUILD" > version.json
          cat version.json

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: version bump [skip ci]"
          git push
